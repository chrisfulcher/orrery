[project]
name = "mentor"
version = "0.0.1"
description = "Free, open source, self-hosted business development intelligence for U.S. federal government contracting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1,<2",
    "click>=8.1",
    "httpx>=0.28",
    "mcp>=2.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "python-docx>=1.1",
    "sqlite-vec>=0.1.9,<0.2",
    "textual>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
serve = ["textual-serve>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/chrisfulcher/mentor"
Issues = "https://github.com/chrisfulcher/mentor/issues"
Design = "https://github.com/chrisfulcher/mentor/blob/main/docs/DESIGN.md"

[project.scripts]
mentor = "mentor.cli:app"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
