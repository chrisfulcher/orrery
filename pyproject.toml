[project]
name = "mentor"
version = "0.1.0"
description = "Free, open source, self-hosted business development intelligence for U.S. federal government contracting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "mcp>=2.1",
    "openpyxl>=3.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "python-docx>=1.1",
    "sqlite-vec>=0.1.9,<0.2",
    "textual>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
serve = ["textual-serve>=1.1"]
# Only the `anthropic` provider needs a vendor SDK; every OpenAI-compatible
# endpoint is reached over plain httpx (README: "Model-agnostic AI").
anthropic = ["anthropic>=1,<2"]

[dependency-groups]
dev = [
    # The anthropic backend is an optional extra for users; the tests always exercise it.
    "anthropic>=1,<2",
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/chrisfulcher/mentor"
Issues = "https://github.com/chrisfulcher/mentor/issues"
Design = "https://github.com/chrisfulcher/mentor/blob/main/docs/DESIGN.md"

[project.scripts]
mentor = "mentor.cli:app"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
