[project]
name = "mentor"
version = "0.0.1"
description = "Free, open source, self-hosted business development intelligence for U.S. federal government contracting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.36",
    "ruff>=0.5",
]

[project.scripts]
mentor = "mentor.cli:app"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
