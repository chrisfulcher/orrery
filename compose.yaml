# No daemon yet: every command is one-shot, so the verb is
#   docker compose run --rm mentor <command>
# `docker compose up` is not useful until a long-running service exists.
services:
  mentor:
    build: .
    env_file: .env
    environment:
      MENTOR_DATA_DIR: /data   # always the mount below, whatever .env says
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a host Ollama, for MENTOR_EMBED_BASE_URL
