name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # uv reads requires-python from pyproject.toml and fetches the
      # interpreter itself, so the Python version lives in one place.
      - name: Install the project
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      # `uv sync --frozen` above installs from the lockfile without checking it
      # still answers pyproject.toml, so a dependency added without relocking
      # would pass every step above and only fail for whoever relocked next.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The full range of the pull request, so every commit can be read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # CONTRIBUTING.md: commits without a sign-off are not merged. Checked
      # here rather than by a third-party app so the rule stays readable and
      # the workflow keeps its dependencies to the two actions above.
      - name: Every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author=$(git show -s --format='%an <%ae>' "$sha")
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              continue
            fi
            if [ "$missing" -eq 0 ]; then
              echo "Commits missing a Signed-off-by line matching their author:"
              echo
            fi
            echo "  $(git show -s --format='%h %s' "$sha")"
            echo "      author: $author"
            missing=1
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add one with 'git commit -s', or to an existing commit with:"
            echo "  git rebase --signoff $BASE"
            echo "See CONTRIBUTING.md and the DCO file."
            exit 1
          fi
          echo "All commits signed off."
