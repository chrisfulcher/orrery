blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/chrisfulcher/orrery/security/advisories/new
    about: Do not open a public issue for a vulnerability. Report it privately here; only the maintainer can read it.
  - name: Read the design doc first
    url: https://github.com/chrisfulcher/orrery/blob/main/docs/DESIGN.md
    about: The design doc is the source of truth. Issues that name the section they respond to are the most useful.
  - name: Ask a question or talk about how your shop works
    url: https://github.com/chrisfulcher/orrery/discussions
    about: For questions, domain input, and anything without a fix at the end of it. You do not need to write code to be useful here.
